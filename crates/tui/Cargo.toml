# vortex-tui: thin terminal frontend. Owns the viewport + render loop (SPEC §5, §7).
[package]
name = "vortex-tui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vortex"
path = "src/main.rs"

[dependencies]
# Channels for the file-watcher seam: the frontend constructs the `WatchHandle`
# it hands the core, so it needs the same channel types `vortex-core` uses.
# Cargo unifies these to one version, which is what makes the handle's `Sender`
# and `Receiver` the same types on both sides.
async-channel = "2.5.0"
# Global search (M7): the gitignore-aware directory walker ripgrep is built on.
# Frontend-side with the rest of the search, and it is what makes the walk respect
# a project's own .gitignore instead of the file picker's hardcoded skip list.
ignore = "0.4.31"
# Load grammar libraries at runtime (M4): the frontend `dlopen`s a `grammar-*`
# cdylib and resolves its `vortex_grammar` entry point. This is the "genuinely
# dynamic" half of syntax highlighting - grammars are config-driven runtime data,
# never compiled into the editor (SPEC §3, §14).
libloading = "0.9.0"
# External-change detection (SPEC §3 "File watch" row, §10.2). Frontend-side by
# design: it owns the OS watch threads and the platform backends, which keeps
# vortex-core headless and lets a remote frontend watch the machine the files are
# actually on. 8.x rather than the 9.0 release candidates - a watcher is not the
# place to run a pre-release.
notify = "8.2.0"
nucleo-matcher = "0.3.1"
# crossterm is used via ratatui's re-export (ratatui::crossterm) so the KeyEvent
# types the render loop and event reader share are guaranteed identical - a
# separate crossterm dep risks version skew against ratatui's bundled 0.29.
ratatui = "0.30.2"
# Global search patterns (M7). SPEC §3 names `regex` for the core's eventual search
# subsystem (select-all-matches, split-on-regex); it arrives here first because
# cross-file search is filesystem work and so is frontend-owned. When the core
# subsystem lands, the dependency joins vortex-core too - one crate, two callers,
# and the match semantics stay the same because the engine does.
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
smol = "2.0.2"
# Theme files (SPEC §3 "Config" row, §10.5): the format the config seam was always
# going to use, arriving first for themes.
toml = "1.1.3"
# Wrap the raw grammar pointer from a loaded dylib back into a `Language` to hand
# to the core highlighter. Only these two tree-sitter crates reach the frontend -
# the grammar's own C is inside the dylib, never linked here.
tree-sitter = "0.26.11"
tree-sitter-language = "0.1.7"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vortex-core = { path = "../core" }

[dev-dependencies]
# The same core, with its test-only builders switched on: the layout tests build a
# `DecorationSet` directly to exercise resolution (see `vortex-core`'s `replace`).
vortex-core = { path = "../core", features = ["test-support"] }
# Microbenchmarks for the display-column paint hot paths (`benches/layout.rs`).
# Slim, matching vortex-core: no plotters/html/rayon, `cargo_bench_support` kept
# for `--save-baseline` and the loop's `--test` smoke mode. Reachable only because
# the layout logic lives in the library target (see `lib.rs`), not the binary.
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "layout"
harness = false
