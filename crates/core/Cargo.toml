# vortex-core: headless editor core. MUST NOT depend on any terminal crate
# (crossterm/ratatui) - that boundary is the whole point (SPEC §1, §15).
[package]
name = "vortex-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-channel = "2.5.0"
# LSP (SPEC §3): tower-based and runtime-agnostic, which is what makes the smol
# choice safe - `tokio` is an opt-in feature and stays off. `stdio` is off too:
# it adapts a *server's* own stdin/stdout, while a client talks to a subprocess's
# pipes, which `async-process` already provides asynchronously. Pins lsp-types
# 0.95 deliberately (its own note), so we use its re-export rather than a
# separate dep that could skew.
async-lsp = { version = "0.2.4", default-features = false, features = [
    "client-monitor",
    "omni-trait",
] }
# Spawning the language server with async pipes. Part of the smol stack, used
# only inside the LSP module - it never appears in a public signature, so the
# core stays executor-agnostic (SPEC §2.3).
async-process = "2.5.0"
crop = "0.4.3"
# Encoding detection + transcoding on the file boundary (SPEC §3, §10.1). Gecko's
# implementation of the WHATWG Encoding Standard: it is what makes "open a
# latin-1 file and save it back byte-for-byte" possible instead of refusing every
# file that is not UTF-8. Confined to `file.rs` and never in a public signature -
# the encoding is exposed as its name, not as an `encoding_rs` type.
encoding_rs = "0.8.35"
# async-lsp's service plumbing (`ServiceBuilder`) and combinators; both are
# required to construct an async-lsp client at all.
futures = "0.3.33"
tower = "0.5.3"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
# Syntax highlighting (SPEC §3, M4): the parser + the highlight-event helper. Both
# stay inside the `syntax` module and appear in no public signature except the
# injected grammar (`tree_sitter::Language`) - a grammar is language data the
# frontend supplies (dlopened at runtime), the same way it hands the LSP module a
# server command. The parse runs on the frontend-spawned producer loop, never the
# editor actor, so the core stays executor-agnostic and off the keystroke path.
tree-sitter = "0.26.11"
tree-sitter-highlight = "0.26.11"
unicode-segmentation = "1.13.3"

[dev-dependencies]
# Microbenchmark harness for the per-keystroke hot paths (`benches/hot_paths.rs`,
# SPEC §13). Slim on purpose: `default-features = false` drops the plotters/html
# report tree and rayon; `cargo_bench_support` is kept for `--save-baseline` A/B
# comparison and the `--test` smoke mode the verification loop runs.
criterion = { version = "0.8.2", default-features = false, features = [
    "cargo_bench_support",
] }
proptest = "1.11.0"
smol = "2.0.2"
# A real grammar to exercise the highlighter end-to-end in-process (no subprocess,
# unlike the LSP client) - which is why `syntax` needs no coverage exemption.
tree-sitter-rust = "0.24.2"

[[bench]]
name = "hot_paths"
harness = false
