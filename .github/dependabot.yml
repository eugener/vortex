# Version updates are disabled (open-pull-requests-limit: 0).
# Security updates are bundled into one grouped PR per ecosystem.
version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
  groups:
    cargo-security:
      applies-to: security-updates
      patterns:
      - '*'
